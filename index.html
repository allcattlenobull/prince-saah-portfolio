<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="A portfolio of problems and practical solutions by Prince Saah.">
  <title>Prince Saah | Problems and possibilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><script src="script.js" defer></script>
</head>
<body>
  <main class="gallery" aria-label="Portfolio of problems and solutions">
    <h1 class="sr-only">Prince Saah: problems and solutions. Select a computer to see a project.</h1>
    <div class="desktop desktop-hiring">
      <button class="computer" type="button" data-project="hiring" aria-haspopup="dialog" aria-label="View the solution: how can we make hiring less overwhelming?">
        <span class="monitor"><span class="screen"><span class="problem">How can we make hiring less overwhelming<span class="question">?</span></span><span class="caret" aria-hidden="true"></span></span><span class="monitor-edge" aria-hidden="true"></span></span>
        <span class="stand" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>
      </button><div class="desk" aria-hidden="true"><span class="keyboard"></span><span class="mouse"></span></div>
    </div>
    <div class="desktop desktop-mwana">
      <button class="computer" type="button" data-project="mwana" aria-haspopup="dialog" aria-label="View the solution: how can a small practice keep its business organized?">
        <span class="monitor"><span class="screen"><span class="problem">How can a small practice keep its business organized<span class="question">?</span></span><span class="caret" aria-hidden="true"></span></span><span class="monitor-edge" aria-hidden="true"></span></span>
        <span class="stand" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>
      </button><div class="desk" aria-hidden="true"><span class="keyboard"></span><span class="mouse"></span></div>
    </div>
    <div class="desktop desktop-called">
      <button class="computer" type="button" data-project="called" aria-haspopup="dialog" aria-label="View the solution: how do you find a career that fits?">
        <span class="monitor"><span class="screen"><span class="problem">How do you find a career that fits<span class="question">?</span></span><span class="caret" aria-hidden="true"></span></span><span class="monitor-edge" aria-hidden="true"></span></span>
        <span class="stand" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>
      </button><div class="desk" aria-hidden="true"><span class="keyboard"></span><span class="mouse"></span></div>
    </div>
    <div class="desktop desktop-acnb">
      <button class="computer" type="button" data-project="acnb" aria-haspopup="dialog" aria-label="View the solution: how can research lead to clearer decisions?">
        <span class="monitor"><span class="screen"><span class="problem">How can research lead to clearer decisions<span class="question">?</span></span><span class="caret" aria-hidden="true"></span></span><span class="monitor-edge" aria-hidden="true"></span></span>
        <span class="stand" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>
      </button><div class="desk" aria-hidden="true"><span class="keyboard"></span><span class="mouse"></span></div>
    </div>
    <div class="desktop desktop-him">
      <button class="computer" type="button" data-project="him" aria-haspopup="dialog" aria-label="View the solution: what if a league had its own home for data and stories?">
        <span class="monitor"><span class="screen"><span class="problem">What if a league had its own home for data and stories<span class="question">?</span></span><span class="caret" aria-hidden="true"></span></span><span class="monitor-edge" aria-hidden="true"></span></span>
        <span class="stand" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>
      </button><div class="desk" aria-hidden="true"><span class="keyboard"></span><span class="mouse"></span></div>
    </div>
  </main>

  <dialog class="case-dialog" aria-labelledby="case-title" aria-describedby="case-description">
    <div class="case-shell"><button class="close" type="button" aria-label="Close project"><span aria-hidden="true"></span></button>
      <div class="case-heading"><p class="case-kicker" id="case-category"></p><h2 id="case-title"></h2><p class="case-status" id="case-status"></p></div>
      <div class="case-content"><div class="case-section"><p class="case-label">THE QUESTION</p><p class="case-question" id="case-question"></p></div><div class="case-section"><p class="case-label">THE SOLUTION</p><p class="case-description" id="case-description"></p><p class="case-detail" id="case-detail"></p><a id="case-link" class="case-link" target="_blank" rel="noopener noreferrer" hidden></a></div></div>
      <div class="case-footer"><span>PRINCE SAAH</span><a href="https://www.linkedin.com/in/prince-saah-250b41a5" target="_blank" rel="noopener noreferrer">CONNECT ON LINKEDIN</a></div>
    </div>
  </dialog>
</body>
</html>
