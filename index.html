<body>
  <h1 class="sr-only">Prince Saah: problems and solutions. Each computer shows a problem. Select it to step inside the solution. Use the arrow keys to move between computers.</h1>

  <main class="void" aria-label="Problems"></main>
  <nav class="dots" aria-label="Choose a problem"></nav>

  <div class="portal" role="dialog" aria-modal="true" aria-labelledby="sol-title">
    <div class="sol" tabindex="-1"></div>
    <button class="close" type="button" aria-label="Step back out"><span aria-hidden="true"></span></button>
  </div>

  <template id="mockup-hiring"><section class="mockup-block" style="--d:6" aria-label="Illustrative mockup of the UMN Talent Workspace hiring workflow"><div class="mockup-label"><span>THE WORKSPACE</span><span>ILLUSTRATIVE MOCKUP</span></div><div class="mock-window mock-hiring" aria-hidden="true"><div class="mock-toolbar"><span></span><span></span><span></span></div><div class="mh-head"><strong>University of Minnesota</strong><span>Talent Workspace</span><b>AI assistant</b></div><div class="mh-layout"><div class="mh-sidebar"><b>Workflow</b><small>DEFINE THE ROLE</small><span>Position Title</span><span class="active">Role Intake</span><span>Work Environment</span><span>Classification</span><span>Compensation</span><span>Job Description</span><small>PLAN THE SEARCH</small><span>Search Design</span></div><div class="mh-main"><small>DEFINE THE ROLE</small><h3>Role Intake</h3><p>Tell us about the position you want to fill.</p><div class="mh-card"><strong>About the position</strong><p>What are you looking for in your next hire?</p><div class="mock-input">Describe the role and its impact...</div><p>What will this person be responsible for?</p><div class="mock-input">Add key responsibilities...</div><span class="mh-button">Continue to Work Environment</span></div></div></div></div><p class="mockup-caption">A view of the local hiring demo, recreated with example content.</p></section></template>
  <template id="mockup-mwana"><section class="mockup-block" style="--d:6" aria-label="Illustrative mockup of the Mwana Therapy finance workspace"><div class="mockup-label"><span>THE WORKSPACE</span><span>ILLUSTRATIVE MOCKUP</span></div><div class="mock-window mock-mwana" aria-hidden="true"><div class="mock-toolbar"><span></span><span></span><span></span></div><div class="mm-head"><strong>MWANA <small>THERAPY</small></strong><span>Admin workspace</span></div><div class="mm-main"><small>FINANCE</small><h3>Finance</h3><div class="mm-tabs"><b>Dashboard</b><span>Transactions</span><span>Invoices</span><span>Accounting</span><span>Reports</span><span>Setup</span></div><h4>Business overview</h4><div class="mm-cards"><div><small>INCOME</small><strong>Overview</strong></div><div><small>EXPENSES</small><strong>Organized</strong></div><div><small>ACCOUNTS</small><strong>Tracked</strong></div></div><div class="mm-ledger"><strong>Recent transactions</strong><div><span>Transaction</span><span>Category</span><span>Account</span></div><div><span>Example entry</span><span>Expense</span><span>Checking</span></div><div><span>Example entry</span><span>Income</span><span>Checking</span></div></div></div></div><p class="mockup-caption">A representative view of the finance workspace. No real financial records are shown.</p></section></template>
  <template id="mockup-called"><section class="mockup-block" style="--d:6" aria-label="Illustrative mockup of the Called career discovery journey"><div class="mockup-label"><span>THE EXPERIENCE</span><span>ILLUSTRATIVE MOCKUP</span></div><div class="mock-window mock-called" aria-hidden="true"><div class="mock-toolbar"><span></span><span></span><span></span></div><div class="mc-head"><strong>called<span>.</span></strong><div>Discover &nbsp;&nbsp; Explore &nbsp;&nbsp; My journey</div></div><div class="mc-main"><small>MY JOURNEY</small><h3>Discover your purpose<br>and career fit.</h3><p>A guided journey in short steps: notice your strengths and what matters to you, then explore what comes next.</p><div class="mc-card"><div><b>Your journey</b><p>Discover your purpose and career fit</p></div><span>Get started</span></div><div class="mc-bottom"><div><b>Explore careers</b><p>Find paths that fit.</p></div><div><b>Your purpose</b><p>See the patterns.</p></div><div><b>What you’ve gathered</b><p>Reflect on your evidence.</p></div></div></div></div><p class="mockup-caption">A representative view of the Called career-discovery journey.</p></section></template>
  <template id="mockup-acnb"><section class="mockup-block" style="--d:6" aria-label="Illustrative mockup of the All Cattle No Bull research workspace"><div class="mockup-label"><span>THE PLATFORM</span><span>ILLUSTRATIVE MOCKUP</span></div><div class="mock-window mock-acnb" aria-hidden="true"><div class="mock-toolbar"><span></span><span></span><span></span></div><div class="ma-layout"><div class="ma-sidebar"><strong>ACNB</strong><small>WORKSPACE</small><span class="active">Command Center</span><span>Trading Desk</span><span>Portfolio</span><span>Research Desk</span><span>Engine Room</span></div><div class="ma-main"><small>ALL CATTLE NO BULL</small><h3>Command Center</h3><p>Research, portfolio and decisions in one place.</p><div class="ma-cards"><div><small>PORTFOLIO</small><strong>Overview</strong><span>Positions and exposure</span></div><div><small>RESEARCH DESK</small><strong>Research</strong><span>Structured analysis</span></div></div><div class="ma-panel"><strong>Research workflow</strong><div class="ma-flow"><span>Data</span><span>Analysis</span><span>Review</span><span>Decision</span></div><div class="ma-lines"><i></i><i></i><i></i></div></div></div></div></div><p class="mockup-caption">A representative view of the platform’s research and portfolio workspace.</p></section></template>
  <template id="mockup-him"><section class="mockup-block" style="--d:6" aria-label="Illustrative mockup of the HIM Dynasty fantasy football league site"><div class="mockup-label"><span>THE LEAGUE</span><span>ILLUSTRATIVE MOCKUP</span></div><div class="mock-window mock-him" aria-hidden="true"><div class="mock-toolbar"><span></span><span></span><span></span></div><div class="mi-head"><strong>HIM <span>DYNASTY</span></strong><div>League &nbsp;&nbsp; Trade &nbsp;&nbsp; Analytics &nbsp;&nbsp; History</div></div><div class="mi-main"><small>THE LEAGUE</small><h3>Matchups</h3><p>Live league data, standings, and stories in one place.</p><div class="mi-card"><div><b>Matchup</b><span>WEEKLY VIEW</span></div><div class="mi-teams"><strong>Team A</strong><span>vs.</span><strong>Team B</strong></div><div class="mi-foot">League matchup overview</div></div><div class="mi-bottom"><div><small>LEAGUE</small><b>Standings</b></div><div><small>SEASON</small><b>Playoff Picture</b></div><div><small>HISTORY</small><b>League Archive</b></div></div></div></div><p class="mockup-caption">A representative league view with fictional team names.</p></section></template>
