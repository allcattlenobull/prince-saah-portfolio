<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Prince Saah about AI consulting, digital products, or a problem you want to solve.">
  <title>Contact Prince | Create With Prince</title>
  <link rel="stylesheet" href="contact.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="contact.js" defer></script>
</head>
<body>
  <header><a href="./">Create With Prince</a><a href="./">Back to the portfolio</a></header>
  <main>
    <p class="eyebrow">Have a problem worth solving?</p>
    <h1>Let’s make something useful.</h1>
    <p class="intro">Tell me a little about what you’re working on. You don’t need to have it all figured out.</p>
    <form id="contact" novalidate>
      <label for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="120" required>
      <label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="message">What’s on your mind?</label><textarea id="message" name="message" minlength="10" maxlength="5000" rows="7" required></textarea>
      <div class="trap" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <div id="verification"></div>
      <p class="status" id="status" role="status" aria-live="polite">Loading the contact form…</p>
      <button type="submit" disabled>Send your message</button>
    </form>
  </main>
</body>
</html>
